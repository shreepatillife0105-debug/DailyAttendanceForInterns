<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Intern Attendance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: #172033;
        }

        .attendance-card {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border: 1px solid #e5eaf1;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(20, 40, 80, 0.10);

            overflow: hidden;
        }

        .header {
            padding: 28px 30px 24px;

            border-bottom: 1px solid #edf0f4;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 22px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;

            border-radius: 11px;

            background: #eef4ff;

            color: #2563eb;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
        }

        .brand-title {
            margin: 0;

            font-size: 18px;
            font-weight: 700;
        }

        .brand-subtitle {
            margin: 3px 0 0;

            font-size: 13px;

            color: #7a8495;
        }

        h1 {
            margin: 0;

            font-size: 24px;
            font-weight: 700;
        }

        .description {
            margin: 7px 0 0;

            font-size: 14px;

            color: #6b7280;
        }

        /* NETWORK STATUS */

        .network-status {
            margin: 20px 30px 0;

            padding: 11px 13px;

            border-radius: 9px;

            display: flex;
            align-items: center;

            gap: 9px;

            font-size: 13px;
            font-weight: 600;
        }

        .network-status.checking {
            background: #f3f4f6;
            color: #6b7280;
        }

        .network-status.connected {
            background: #ecfdf3;
            color: #087443;
        }

        .network-status.disconnected {
            background: #fff4f2;
            color: #c4321d;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: currentColor;
        }

        /* FORM */

        .form-container {
            padding: 28px 30px 30px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #344054;
        }

        input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            border: 1px solid #d7dce5;

            border-radius: 9px;

            background: #ffffff;

            color: #172033;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        input:disabled {
            background: #f5f7fa;

            color: #667085;

            cursor: not-allowed;
        }

        /* BUTTON */

        .submit-button {
            width: 100%;
            height: 47px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .submit-button:disabled {
            background: #9aa4b2;

            cursor: not-allowed;
        }

        /* MESSAGE */

        #message {
            display: none;

            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 9px;

            font-size: 13px;

            text-align: center;
        }

        #message.success {
            display: block;

            background: #ecfdf3;

            color: #087443;

            border: 1px solid #c8f0da;
        }

        #message.error {
            display: block;

            background: #fff4f2;

            color: #c4321d;

            border: 1px solid #ffd6cf;
        }

        .footer {
            padding: 14px 30px;

            border-top: 1px solid #edf0f4;

            background: #fafbfc;

            text-align: center;

            font-size: 11px;

            color: #8a93a3;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .header {
                padding: 24px 22px 20px;
            }

            .network-status {
                margin-left: 22px;
                margin-right: 22px;
            }

            .form-container {
                padding: 24px 22px;
            }

            .footer {
                padding-left: 22px;
                padding-right: 22px;
            }

        }

    </style>

</head>


<body>


<div class="attendance-card">


    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="brand-icon">
                ✓
            </div>

            <div>

                <p class="brand-title">
                    Daily Attendance
                </p>

                <p class="brand-subtitle">
                    Intern Attendance Portal
                </p>

            </div>

        </div>


        <h1>
            Mark Attendance
        </h1>

        <p class="description">
            Enter your registered details and today's exit time.
        </p>

    </div>


    <!-- NETWORK STATUS -->

    <div
        id="networkStatus"
        class="network-status checking"
    >

        <span class="status-dot"></span>

        <span id="networkText">
            Checking company network...
        </span>

    </div>


    <!-- FORM -->

    <div class="form-container">

        <form id="attendanceForm">


            <div class="form-group">

                <label for="employeeId">
                    Employee ID
                </label>

                <input
                    type="number"
                    id="employeeId"
                    placeholder="Enter employee ID"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter registered email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="exitTime">
                    Exit Time
                </label>

                <input
                    type="text"
                    id="exitTime"
                    placeholder="Example: 06:30 PM"
                    required
                >

            </div>


            <!-- IMPORTANT:
                 NOT disabled -->

            <button
                type="submit"
                id="submitButton"
                class="submit-button"
            >
                Submit Attendance
            </button>


            <!-- ONLY ONE MESSAGE -->

            <div id="message"></div>

        </form>

    </div>


    <div class="footer">

        Attendance can be marked only from the company network.

    </div>


</div>



<script>


/* =====================================================
   API
===================================================== */

const API =
    "http://192.168.1.11/DailyAttendancebackend/intern_attendance.php";


/* =====================================================
   LOCAL STORAGE
===================================================== */

const SAVED_ID =
    "intern_attendance_id";

const SAVED_EMAIL =
    "intern_attendance_email";


/* =====================================================
   ELEMENTS
===================================================== */

const employeeId =
    document.getElementById("employeeId");

const email =
    document.getElementById("email");

const exitTime =
    document.getElementById("exitTime");

const form =
    document.getElementById("attendanceForm");

const button =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");

const networkStatus =
    document.getElementById("networkStatus");

const networkText =
    document.getElementById("networkText");


/* =====================================================
   LOAD SAVED INTERN
===================================================== */

const savedId =
    localStorage.getItem(SAVED_ID);

const savedEmail =
    localStorage.getItem(SAVED_EMAIL);


if (savedId && savedEmail) {

    employeeId.value =
        savedId;

    email.value =
        savedEmail;

    /*
     * Remembered intern cannot change
     * ID or email from this browser.
     */

    employeeId.disabled =
        true;

    email.disabled =
        true;
}


/* =====================================================
   NETWORK CHECK
===================================================== */

async function checkNetwork() {

    networkStatus.className =
        "network-status checking";

    networkText.innerText =
        "Checking company network...";


    try {

        /*
         * IMPORTANT:
         *
         * We use POST here because your PHP
         * endpoint accepts POST.
         *
         * Empty data will only cause PHP
         * validation to fail.
         *
         * It will NOT insert attendance.
         */

        const response =
            await fetch(
                API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({})
                }
            );


        /*
         * If PHP responded, server is reachable.
         */

        if (response) {

            networkStatus.className =
                "network-status connected";

            networkText.innerText =
                "Connected to company network";

            return true;
        }


    } catch (error) {

        networkStatus.className =
            "network-status disconnected";

        networkText.innerText =
            "Connect to company Wi-Fi to mark attendance";

        return false;
    }

}


/* =====================================================
   INITIAL CHECK
===================================================== */

checkNetwork();


/* =====================================================
   SUBMIT
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /*
         * Do NOT disable the button just because
         * the network check is running.
         */

        clearMessage();


        const id =
            employeeId.value.trim();

        const userEmail =
            email.value.trim();

        const exit =
            exitTime.value.trim();


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (!id) {

            showMessage(
                "Employee ID is required.",
                false
            );

            return;
        }


        if (!userEmail) {

            showMessage(
                "Email is required.",
                false
            );

            return;
        }


        if (!exit) {

            showMessage(
                "Exit time is required.",
                false
            );

            return;
        }


        /* ---------------------------------------------
           SUBMIT
        --------------------------------------------- */

        button.disabled =
            true;

        button.innerText =
            "Saving...";


        try {

            const response =
                await fetch(
                    API,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            employee_id:
                                Number(id),

                            email:
                                userEmail,

                            exit_time:
                                exit

                        })
                    }
                );


            const result =
                await response.json();


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            if (result.success) {

                /*
                 * Remember intern.
                 */

                localStorage.setItem(
                    SAVED_ID,
                    id
                );

                localStorage.setItem(
                    SAVED_EMAIL,
                    userEmail
                );


                /*
                 * Lock ID + email.
                 */

                employeeId.disabled =
                    true;

                email.disabled =
                    true;


                /*
                 * Clear exit field.
                 */

                exitTime.value =
                    "";


                showMessage(
                    "Attendance successfully added.",
                    true
                );


                button.innerText =
                    "Attendance Added";

                button.disabled =
                    true;

                return;
            }


            /* -----------------------------------------
               PHP ERROR
            ----------------------------------------- */

            showMessage(
                result.message ||
                "Unable to add attendance.",
                false
            );


            button.disabled =
                false;

            button.innerText =
                "Submit Attendance";


        } catch (error) {

            /*
             * Server / Wi-Fi problem.
             */

            networkStatus.className =
                "network-status disconnected";

            networkText.innerText =
                "Connect to company Wi-Fi to mark attendance";


            showMessage(
                "Unable to connect to attendance server.",
                false
            );


            button.disabled =
                false;

            button.innerText =
                "Submit Attendance";
        }

    }
);


/* =====================================================
   MESSAGE FUNCTIONS
===================================================== */

function showMessage(
    text,
    success
) {

    message.innerText =
        text;

    message.className =
        success
            ? "success"
            : "error";

    message.style.display =
        "block";
}


function clearMessage() {

    message.innerText =
        "";

    message.className =
        "";

    message.style.display =
        "none";
}


</script>


</body>

</html>
