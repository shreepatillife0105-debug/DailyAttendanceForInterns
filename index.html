<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Intern Attendance</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            margin: 0;
        }


        .box {
            width: 350px;

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.1);
        }


        h2 {
            text-align: center;
            margin-bottom: 25px;
        }


        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 11px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            box-sizing: border-box;

            font-size: 15px;
        }


        input:disabled {
            background: #eeeeee;
        }


        button {
            width: 100%;

            padding: 12px;

            background: #0d6efd;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 15px;

            cursor: pointer;
        }


        button:disabled {
            background: #999;
        }


        #message {
            margin-top: 18px;

            padding: 12px;

            border-radius: 6px;

            text-align: center;

            display: none;
        }


        .success {
            background: #d1e7dd;

            color: #0f5132;
        }


        .error {
            background: #f8d7da;

            color: #842029;
        }

    </style>

</head>


<body>


<div class="box">

    <h2>
        Intern Attendance
    </h2>


    <form id="attendanceForm">


        <label>
            Employee ID
        </label>

        <input
            type="number"
            id="employeeId"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            required
        >


        <label>
            Exit Time
        </label>

        <input
            type="text"
            id="exitTime"
            placeholder="Example: 06:30 PM"
            required
        >


        <button
            type="submit"
            id="submitButton"
        >
            Submit
        </button>


    </form>


    <div id="message"></div>


</div>



<script>


const API =
    "http://192.168.1.5/DailyAttendancebackend/intern_attendance.php";


// --------------------------------------------------
// LocalStorage keys
// --------------------------------------------------

const SAVED_ID =
    "intern_attendance_id";

const SAVED_EMAIL =
    "intern_attendance_email";


// --------------------------------------------------
// Get fields
// --------------------------------------------------

const employeeId =
    document.getElementById("employeeId");

const email =
    document.getElementById("email");

const exitTime =
    document.getElementById("exitTime");

const form =
    document.getElementById("attendanceForm");

const button =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");


// --------------------------------------------------
// Load saved employee
// --------------------------------------------------

const savedId =
    localStorage.getItem(SAVED_ID);

const savedEmail =
    localStorage.getItem(SAVED_EMAIL);


if (savedId && savedEmail) {

    employeeId.value =
        savedId;

    email.value =
        savedEmail;


    /*
     * Lock ID and email.
     *
     * Intern cannot simply change
     * the browser to another employee.
     */

    employeeId.disabled =
        true;

    email.disabled =
        true;
}


// --------------------------------------------------
// Submit
// --------------------------------------------------

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.style.display =
            "none";


        const id =
            employeeId.value.trim();

        const userEmail =
            email.value.trim();

        const exit =
            exitTime.value.trim();


        if (!id) {

            showMessage(
                "Employee ID is required.",
                false
            );

            return;
        }


        if (!userEmail) {

            showMessage(
                "Email is required.",
                false
            );

            return;
        }


        if (!exit) {

            showMessage(
                "Exit time is required.",
                false
            );

            return;
        }


        button.disabled =
            true;

        button.innerText =
            "Saving...";


        try {

            const response =
                await fetch(
                    API,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            employee_id:
                                Number(id),

                            email:
                                userEmail,

                            exit_time:
                                exit

                        })
                    }
                );


            const result =
                await response.json();


            if (result.success) {


                // ------------------------------------------
                // Remember this intern's ID + email
                // ------------------------------------------

                localStorage.setItem(
                    SAVED_ID,
                    id
                );

                localStorage.setItem(
                    SAVED_EMAIL,
                    userEmail
                );


                showMessage(
                    "Attendance successfully added.",
                    true
                );


                /*
                 * Clear only exit time.
                 *
                 * ID + email remain stored.
                 */

                exitTime.value =
                    "";


                button.disabled =
                    true;


            } else {

                showMessage(
                    result.message,
                    false
                );


                button.disabled =
                    false;

                button.innerText =
                    "Submit";
            }


        } catch (error) {

            showMessage(
                "Unable to connect to server.",
                false
            );


            button.disabled =
                false;

            button.innerText =
                "Submit";
        }

    }
);


// --------------------------------------------------
// Message
// --------------------------------------------------

function showMessage(
    text,
    success
) {

    message.innerText =
        text;

    message.className =
        success
            ? "success"
            : "error";

    message.style.display =
        "block";
}

</script>


</body>

</html>
