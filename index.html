<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Intern Attendance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 15px;
        }

        input:disabled {
            background: #eee;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #0d6efd;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }

        .info {
            background: #f1f5f9;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        .info div {
            margin-bottom: 8px;
        }

        .success {
            background: #d1e7dd;

            color: #0f5132;

            padding: 15px;

            border-radius: 8px;

            margin-top: 15px;

            text-align: center;
        }

        .error {
            background: #f8d7da;

            color: #842029;

            padding: 15px;

            border-radius: 8px;

            margin-top: 15px;

            text-align: center;
        }

        .hidden {
            display: none;
        }

        .completed {
            text-align: center;

            padding: 20px;

            background: #d1e7dd;

            color: #0f5132;

            border-radius: 10px;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="box">

    <h2>
        Intern Attendance
    </h2>


    <!-- ID + EMAIL -->

    <div id="loginSection">

        <label>
            Employee ID
        </label>

        <input
            type="number"
            id="employeeId"
            placeholder="Enter Employee ID"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >


        <button
            id="submitButton"
            onclick="submitAttendance()"
        >
            Submit
        </button>

    </div>


    <!-- ATTENDANCE -->

    <div
        id="attendanceSection"
        class="hidden"
    >

        <div class="info">

            <div>
                <b>Name:</b>
                <span id="name"></span>
            </div>

            <div>
                <b>Entry:</b>
                <span id="entry"></span>
            </div>

        </div>


        <label>
            Exit Time
        </label>

        <input
            type="text"
            id="exitTime"
            placeholder="Example: 06:30 PM"
        >


        <button
            id="exitButton"
            onclick="submitExit()"
        >
            Save Exit Time
        </button>

    </div>


    <!-- SUCCESS -->

    <div
        id="success"
        class="success hidden"
    ></div>


    <!-- ERROR -->

    <div
        id="error"
        class="error hidden"
    ></div>


    <!-- COMPLETED -->

    <div
        id="completed"
        class="completed hidden"
    >

        ✓ Attendance successfully completed.

        <br><br>

        You can close this page.

    </div>


</div>



<script>


/*
|--------------------------------------------------------------------------
| PHP API
|--------------------------------------------------------------------------
*/

const API =
    "http://192.168.1.5/DailyAttendancebackend/intern_attendance_simple.php";


/*
|--------------------------------------------------------------------------
| Browser Storage
|--------------------------------------------------------------------------
*/

const STORAGE_ID =
    "intern_attendance_employee_id";

const STORAGE_EMAIL =
    "intern_attendance_email";


/*
|--------------------------------------------------------------------------
| Elements
|--------------------------------------------------------------------------
*/

const employeeId =
    document.getElementById("employeeId");

const email =
    document.getElementById("email");

const loginSection =
    document.getElementById("loginSection");

const attendanceSection =
    document.getElementById("attendanceSection");

const nameElement =
    document.getElementById("name");

const entryElement =
    document.getElementById("entry");

const success =
    document.getElementById("success");

const error =
    document.getElementById("error");

const completed =
    document.getElementById("completed");



/*
|--------------------------------------------------------------------------
| PAGE LOAD
|--------------------------------------------------------------------------
*/

window.onload = function () {

    const savedId =
        localStorage.getItem(STORAGE_ID);

    const savedEmail =
        localStorage.getItem(STORAGE_EMAIL);


    /*
    |----------------------------------------------------------------------
    | Existing browser employee
    |----------------------------------------------------------------------
    */

    if (savedId && savedEmail) {

        employeeId.value =
            savedId;

        email.value =
            savedEmail;

        employeeId.disabled =
            true;

        email.disabled =
            true;


        /*
        | Automatically check today's attendance
        */

        checkExistingAttendance(
            savedId,
            savedEmail
        );
    }

};



/*
|--------------------------------------------------------------------------
| CHECK EXISTING ATTENDANCE
|--------------------------------------------------------------------------
*/

async function checkExistingAttendance(
    id,
    userEmail
) {

    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    employee_id:
                        Number(id),

                    email:
                        userEmail,

                    exit_time:
                        ""

                })

            });


        const result =
            await response.json();


        if (!result.success) {

            showError(
                result.message
            );

            return;
        }


        showAttendance(
            result
        );


    } catch (e) {

        showError(
            "Unable to connect to server."
        );

    }

}



/*
|--------------------------------------------------------------------------
| FIRST SUBMIT
|--------------------------------------------------------------------------
*/

async function submitAttendance() {

    clearMessages();


    const id =
        employeeId.value.trim();

    const userEmail =
        email.value.trim();


    if (!id) {

        showError(
            "Please enter Employee ID."
        );

        return;
    }


    if (!userEmail) {

        showError(
            "Please enter Email."
        );

        return;
    }


    const button =
        document.getElementById(
            "submitButton"
        );

    button.disabled =
        true;

    button.innerText =
        "Checking...";


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    employee_id:
                        Number(id),

                    email:
                        userEmail,

                    exit_time:
                        ""

                })

            });


        const result =
            await response.json();


        if (!result.success) {

            showError(
                result.message
            );

            button.disabled =
                false;

            button.innerText =
                "Submit";

            return;
        }


        /*
        |--------------------------------------------------------------------------
        | SAVE EMPLOYEE IN BROWSER
        |--------------------------------------------------------------------------
        */

        localStorage.setItem(
            STORAGE_ID,
            id
        );

        localStorage.setItem(
            STORAGE_EMAIL,
            userEmail
        );


        /*
        |--------------------------------------------------------------------------
        | LOCK ID + EMAIL
        |--------------------------------------------------------------------------
        */

        employeeId.disabled =
            true;

        email.disabled =
            true;


        showAttendance(
            result
        );


    } catch (e) {

        showError(
            "Unable to connect to server."
        );

        button.disabled =
            false;

        button.innerText =
            "Submit";
    }

}



/*
|--------------------------------------------------------------------------
| SHOW ATTENDANCE
|--------------------------------------------------------------------------
*/

function showAttendance(result) {

    loginSection.classList.add(
        "hidden"
    );

    attendanceSection.classList.remove(
        "hidden"
    );


    nameElement.innerText =
        result.name;


    entryElement.innerText =
        formatTime(
            result.in_time
        );


    /*
    |--------------------------------------------------------------------------
    | Already completed
    |--------------------------------------------------------------------------
    */

    if (
        result.type ===
        "COMPLETED"
    ) {

        attendanceSection.classList.add(
            "hidden"
        );

        completed.classList.remove(
            "hidden"
        );

        return;
    }


    /*
    |--------------------------------------------------------------------------
    | Entry created / already exists
    |--------------------------------------------------------------------------
    */

    if (
        result.type ===
        "ENTRY" ||
        result.type ===
        "ENTRY_EXISTS"
    ) {

        showSuccess(
            "Entry time successfully recorded."
        );

    }

}



/*
|--------------------------------------------------------------------------
| SAVE EXIT
|--------------------------------------------------------------------------
*/

async function submitExit() {

    clearMessages();


    const id =
        localStorage.getItem(
            STORAGE_ID
        );

    const userEmail =
        localStorage.getItem(
            STORAGE_EMAIL
        );

    const exitTime =
        document.getElementById(
            "exitTime"
        ).value.trim();


    if (!exitTime) {

        showError(
            "Please enter exit time."
        );

        return;
    }


    const button =
        document.getElementById(
            "exitButton"
        );

    button.disabled =
        true;

    button.innerText =
        "Saving...";


    try {

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    employee_id:
                        Number(id),

                    email:
                        userEmail,

                    exit_time:
                        exitTime

                })

            });


        const result =
            await response.json();


        if (!result.success) {

            showError(
                result.message
            );

            button.disabled =
                false;

            button.innerText =
                "Save Exit Time";

            return;
        }


        /*
        |--------------------------------------------------------------------------
        | FINAL SUCCESS
        |--------------------------------------------------------------------------
        */

        attendanceSection.classList.add(
            "hidden"
        );

        completed.classList.remove(
            "hidden"
        );


        showSuccess(
            "Attendance successfully completed."
        );


    } catch (e) {

        showError(
            "Unable to connect to server."
        );

        button.disabled =
            false;

        button.innerText =
            "Save Exit Time";
    }

}



/*
|--------------------------------------------------------------------------
| FORMAT TIME
|--------------------------------------------------------------------------
*/

function formatTime(time) {

    if (!time) {
        return "-";
    }


    const parts =
        time.split(":");


    let hour =
        Number(parts[0]);

    const minute =
        parts[1];


    const ampm =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12 || 12;


    return (
        hour +
        ":" +
        minute +
        " " +
        ampm
    );
}



/*
|--------------------------------------------------------------------------
| MESSAGES
|--------------------------------------------------------------------------
*/

function showError(message) {

    error.innerText =
        message;

    error.classList.remove(
        "hidden"
    );

}


function showSuccess(message) {

    success.innerText =
        message;

    success.classList.remove(
        "hidden"
    );

}


function clearMessages() {

    error.classList.add(
        "hidden"
    );

    success.classList.add(
        "hidden"
    );

}

</script>


</body>

</html>
