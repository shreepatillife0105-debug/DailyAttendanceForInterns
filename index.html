<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Intern Attendance</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="page">

    <div class="attendance-card">


        <!-- HEADER -->

        <div class="header">

            <div class="logo">
                ✓
            </div>

            <h1>
                Intern Attendance
            </h1>

            <p>
                Daily Attendance System
            </p>

        </div>



        <!-- NETWORK -->

        <div
            id="networkStatus"
            class="network checking"
        >
            Checking company Wi-Fi...
        </div>



        <!-- ERROR -->

        <div
            id="errorMessage"
            class="message error"
        >
        </div>



        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="message success"
        >
        </div>



        <!-- LOGIN / IDENTIFICATION -->

        <div id="identitySection">


            <div class="form-group">

                <label for="employeeId">
                    Employee ID
                </label>

                <input
                    type="number"
                    id="employeeId"
                    placeholder="Enter Employee ID"
                    autocomplete="off"
                >

            </div>



            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter registered email"
                    autocomplete="off"
                >

            </div>



            <button
                type="button"
                id="checkButton"
            >
                Check Attendance
            </button>


        </div>



        <!-- ATTENDANCE SECTION -->

        <div
            id="attendanceSection"
            class="attendance-section"
        >


            <div class="employee-info">

                <span>
                    Employee
                </span>

                <strong id="employeeName">
                    -
                </strong>

            </div>



            <div class="date-box">

                <div>

                    <span>
                        Today's Date
                    </span>

                    <strong id="todayDate">
                        -
                    </strong>

                </div>

                <div class="lock">
                    🔒
                </div>

            </div>



            <!-- ENTRY -->

            <div
                id="entryInfo"
                class="time-card"
            >

                <span>
                    Entry Time
                </span>

                <strong id="entryTime">
                    Not marked
                </strong>

            </div>



            <!-- EXIT -->

            <div
                id="exitInfo"
                class="time-card"
            >

                <span>
                    Exit Time
                </span>

                <strong id="exitTime">
                    Not marked
                </strong>

            </div>



            <!-- ENTRY BUTTON -->

            <button
                type="button"
                id="entryButton"
                class="entry-button"
            >
                Mark Entry
            </button>



            <!-- EXIT BUTTON -->

            <button
                type="button"
                id="exitButton"
                class="exit-button"
            >
                Mark Exit
            </button>



            <!-- FINISHED -->

            <div
                id="completedMessage"
                class="completed"
            >

                ✓ Today's attendance completed

            </div>



            <!-- CHANGE USER -->

            <button
                type="button"
                id="changeUserButton"
                class="change-button"
            >
                Change Employee
            </button>


        </div>



        <!-- FOOTER -->

        <div class="footer">

            <p>
                Attendance can only be marked from company Wi-Fi.
            </p>

            <p>
                Entry and exit are recorded using server time.
            </p>

        </div>


    </div>

</div>



<script>


/*
|--------------------------------------------------------------------------
| API
|--------------------------------------------------------------------------
*/

const API_URL =
    "http://192.168.1.5/DailyAttendancebackend/intern_attendance.php";



/*
|--------------------------------------------------------------------------
| Elements
|--------------------------------------------------------------------------
*/

const employeeIdInput =
    document.getElementById('employeeId');

const emailInput =
    document.getElementById('email');

const checkButton =
    document.getElementById('checkButton');

const entryButton =
    document.getElementById('entryButton');

const exitButton =
    document.getElementById('exitButton');

const changeUserButton =
    document.getElementById('changeUserButton');

const identitySection =
    document.getElementById('identitySection');

const attendanceSection =
    document.getElementById('attendanceSection');

const employeeName =
    document.getElementById('employeeName');

const todayDate =
    document.getElementById('todayDate');

const entryTime =
    document.getElementById('entryTime');

const exitTime =
    document.getElementById('exitTime');

const completedMessage =
    document.getElementById('completedMessage');

const networkStatus =
    document.getElementById('networkStatus');

const errorMessage =
    document.getElementById('errorMessage');

const successMessage =
    document.getElementById('successMessage');



/*
|--------------------------------------------------------------------------
| Current employee
|--------------------------------------------------------------------------
*/

let currentEmployeeId = null;

let currentEmail = null;



/*
|--------------------------------------------------------------------------
| Show today's date
|--------------------------------------------------------------------------
*/

function showToday() {

    const now = new Date();

    const date =
        now.toLocaleDateString(
            'en-IN',
            {
                timeZone: 'Asia/Kolkata',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }
        );

    todayDate.textContent = date;
}


showToday();



/*
|--------------------------------------------------------------------------
| Clear messages
|--------------------------------------------------------------------------
*/

function clearMessages() {

    errorMessage.style.display =
        'none';

    successMessage.style.display =
        'none';

    errorMessage.innerHTML =
        '';

    successMessage.innerHTML =
        '';
}



/*
|--------------------------------------------------------------------------
| Error
|--------------------------------------------------------------------------
*/

function showError(message) {

    errorMessage.innerHTML =
        message;

    errorMessage.style.display =
        'block';
}



/*
|--------------------------------------------------------------------------
| Success
|--------------------------------------------------------------------------
*/

function showSuccess(message) {

    successMessage.innerHTML =
        message;

    successMessage.style.display =
        'block';
}



/*
|--------------------------------------------------------------------------
| Check company network
|--------------------------------------------------------------------------
*/

async function checkNetwork() {

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({})
                }
            );


        const result =
            await response.json();


        /*
        |--------------------------------------------------------------
        | Company network accepted
        |--------------------------------------------------------------
        */

        if (
            result.error ===
            'Employee ID is required.'
        ) {

            networkStatus.textContent =
                '✓ Connected to company Wi-Fi';

            networkStatus.className =
                'network connected';

            checkButton.disabled =
                false;

            return true;
        }


        /*
        |--------------------------------------------------------------
        | Company network rejected
        |--------------------------------------------------------------
        */

        if (
            result.error &&
            result.error.includes(
                'company Wi-Fi'
            )
        ) {

            networkStatus.textContent =
                '✕ Connect to company Wi-Fi';

            networkStatus.className =
                'network disconnected';

            checkButton.disabled =
                true;

            return false;
        }


        networkStatus.textContent =
            '✓ Company server available';

        networkStatus.className =
            'network connected';

        checkButton.disabled =
            false;

        return true;


    } catch (error) {

        networkStatus.textContent =
            '✕ Attendance server unavailable';

        networkStatus.className =
            'network disconnected';

        checkButton.disabled =
            true;

        return false;
    }

}



/*
|--------------------------------------------------------------------------
| CHECK ATTENDANCE
|--------------------------------------------------------------------------
*/

checkButton.addEventListener(
    'click',
    async function() {

        clearMessages();


        const employeeId =
            employeeIdInput.value.trim();

        const email =
            emailInput.value.trim();


        if (!employeeId) {

            showError(
                'Please enter your Employee ID.'
            );

            return;
        }


        if (!email) {

            showError(
                'Please enter your email address.'
            );

            return;
        }


        checkButton.disabled =
            true;

        checkButton.textContent =
            'Checking...';


        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({

                            employee_id:
                                parseInt(employeeId),

                            email:
                                email,

                            action:
                                'status'

                        })
                    }
                );


            const result =
                await response.json();


            if (!result.success) {

                showError(
                    result.error ||
                    'Unable to verify employee.'
                );

                checkButton.disabled =
                    false;

                checkButton.textContent =
                    'Check Attendance';

                return;
            }


            /*
            |----------------------------------------------------------
            | Store employee
            |----------------------------------------------------------
            */

            currentEmployeeId =
                parseInt(employeeId);

            currentEmail =
                email;


            /*
            |----------------------------------------------------------
            | Show employee information
            |----------------------------------------------------------
            */

            employeeName.textContent =
                result.data.name;


            identitySection.style.display =
                'none';

            attendanceSection.style.display =
                'block';


            /*
            |----------------------------------------------------------
            | Update attendance UI
            |----------------------------------------------------------
            */

            updateAttendanceUI(result);


        } catch (error) {

            showError(
                'Unable to connect to attendance server.'
            );

            checkButton.disabled =
                false;

            checkButton.textContent =
                'Check Attendance';
        }

    }
);



/*
|--------------------------------------------------------------------------
| Update Attendance UI
|--------------------------------------------------------------------------
*/

function updateAttendanceUI(result) {

    clearMessages();


    /*
    |----------------------------------------------------------------------
    | No attendance today
    |----------------------------------------------------------------------
    */

    if (!result.attendance_exists) {

        entryTime.textContent =
            'Not marked';

        exitTime.textContent =
            'Not available yet';


        entryButton.style.display =
            'block';

        exitButton.style.display =
            'none';

        completedMessage.style.display =
            'none';


        return;
    }


    /*
    |----------------------------------------------------------------------
    | Attendance exists
    |----------------------------------------------------------------------
    */

    entryTime.textContent =
        formatTime(result.data.in_time);


    /*
    |----------------------------------------------------------------------
    | Exit already marked
    |----------------------------------------------------------------------
    */

    if (
        result.data.out_time &&
        result.data.out_time !== ''
    ) {

        exitTime.textContent =
            formatTime(
                result.data.out_time
            );


        entryButton.style.display =
            'none';

        exitButton.style.display =
            'none';

        completedMessage.style.display =
            'block';

        return;
    }


    /*
    |----------------------------------------------------------------------
    | Entry exists but exit not marked
    |----------------------------------------------------------------------
    */

    exitTime.textContent =
        'Not marked';


    entryButton.style.display =
        'none';

    exitButton.style.display =
        'block';

    completedMessage.style.display =
        'none';
}



/*
|--------------------------------------------------------------------------
| MARK ENTRY
|--------------------------------------------------------------------------
*/

entryButton.addEventListener(
    'click',
    async function() {

        clearMessages();


        entryButton.disabled =
            true;

        entryButton.textContent =
            'Saving Entry...';


        try {

            const result =
                await sendAttendance(
                    'entry'
                );


            if (!result.success) {

                showError(
                    result.error ||
                    'Unable to mark entry.'
                );

                entryButton.disabled =
                    false;

                entryButton.textContent =
                    'Mark Entry';

                return;
            }


            /*
            |----------------------------------------------------------
            | Entry successful
            |----------------------------------------------------------
            */

            entryTime.textContent =
                formatTime(
                    result.data.in_time
                );


            entryButton.style.display =
                'none';


            exitButton.style.display =
                'block';


            exitButton.disabled =
                false;


            showSuccess(
                `Entry marked successfully at ${formatTime(result.data.in_time)}.`
            );


        } catch (error) {

            showError(
                'Unable to connect to attendance server.'
            );

            entryButton.disabled =
                false;

            entryButton.textContent =
                'Mark Entry';
        }

    }
);



/*
|--------------------------------------------------------------------------
| MARK EXIT
|--------------------------------------------------------------------------
*/

exitButton.addEventListener(
    'click',
    async function() {

        clearMessages();


        const confirmed =
            confirm(
                'Are you sure you want to mark your exit time?'
            );


        if (!confirmed) {

            return;
        }


        exitButton.disabled =
            true;

        exitButton.textContent =
            'Saving Exit...';


        try {

            const result =
                await sendAttendance(
                    'exit'
                );


            if (!result.success) {

                showError(
                    result.error ||
                    'Unable to mark exit.'
                );

                exitButton.disabled =
                    false;

                exitButton.textContent =
                    'Mark Exit';

                return;
            }


            /*
            |----------------------------------------------------------
            | Exit successful
            |----------------------------------------------------------
            */

            exitTime.textContent =
                formatTime(
                    result.data.out_time
                );


            exitButton.style.display =
                'none';


            completedMessage.style.display =
                'block';


            showSuccess(
                `Exit marked successfully at ${formatTime(result.data.out_time)}.`
            );


        } catch (error) {

            showError(
                'Unable to connect to attendance server.'
            );

            exitButton.disabled =
                false;

            exitButton.textContent =
                'Mark Exit';
        }

    }
);



/*
|--------------------------------------------------------------------------
| Send attendance request
|--------------------------------------------------------------------------
*/

async function sendAttendance(action) {

    const response =
        await fetch(
            API_URL,
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({

                    employee_id:
                        currentEmployeeId,

                    email:
                        currentEmail,

                    action:
                        action

                })
            }
        );


    return await response.json();
}



/*
|--------------------------------------------------------------------------
| Change employee
|--------------------------------------------------------------------------
*/

changeUserButton.addEventListener(
    'click',
    function() {

        currentEmployeeId =
            null;

        currentEmail =
            null;


        employeeIdInput.value =
            '';

        emailInput.value =
            '';


        employeeName.textContent =
            '-';

        entryTime.textContent =
            'Not marked';

        exitTime.textContent =
            'Not marked';


        attendanceSection.style.display =
            'none';

        identitySection.style.display =
            'block';


        checkButton.disabled =
            false;

        checkButton.textContent =
            'Check Attendance';


        clearMessages();
    }
);



/*
|--------------------------------------------------------------------------
| Format time
|--------------------------------------------------------------------------
*/

function formatTime(time) {

    if (!time) {
        return '-';
    }


    const parts =
        time.split(':');


    let hour =
        parseInt(parts[0]);


    const minute =
        parts[1];


    const second =
        parts[2];


    const ampm =
        hour >= 12
            ? 'PM'
            : 'AM';


    hour =
        hour % 12 || 12;


    return (
        hour +
        ':' +
        minute +
        ':' +
        second +
        ' ' +
        ampm
    );
}



/*
|--------------------------------------------------------------------------
| Initial state
|--------------------------------------------------------------------------
*/

attendanceSection.style.display =
    'none';

exitButton.style.display =
    'none';

completedMessage.style.display =
    'none';


/*
|--------------------------------------------------------------------------
| Check network on page load
|--------------------------------------------------------------------------
*/

checkNetwork();

</script>


</body>

</html>
